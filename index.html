        // ==================== FUNÇÕES DE CONFIGURAÇÃO ====================
        async function loadStaffConfig() {
            try {
                const docRef = doc(db, "config", "staff");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    staffConfig.rotation = data.rotation || staffConfig.rotation;
                    staffConfig.sabado_fixo = data.sabado_fixo || staffConfig.sabado_fixo;
                    staffConfig.domingo_fixo = data.domingo_fixo || staffConfig.domingo_fixo;
                    staffConfig.quinta_fixo = data.quinta_fixo || staffConfig.quinta_fixo;
                } else {
                    await setDoc(docRef, {
                        rotation: staffConfig.rotation,
                        sabado_fixo: staffConfig.sabado_fixo,
                        domingo_fixo: staffConfig.domingo_fixo,
                        quinta_fixo: staffConfig.quinta_fixo
                    });
                }
            } catch (error) {
                console.error("Erro ao carregar configuração:", error);
            }
        }

        async function saveStaffConfig(newRotation, newSabado, newDomingo, newQuinta) {
            if (!sessionUser) return;
            try {
                const docRef = doc(db, "config", "staff");
                await setDoc(docRef, {
                    rotation: newRotation,
                    sabado_fixo: newSabado,
                    domingo_fixo: newDomingo,
                    quinta_fixo: newQuinta
                }, { merge: true });
                staffConfig.rotation = newRotation;
                staffConfig.sabado_fixo = newSabado;
                staffConfig.domingo_fixo = newDomingo;
                staffConfig.quinta_fixo = newQuinta;
                buildCalendar();
            } catch (error) {
                console.error("Erro ao salvar configuração:", error);
                alert("Não foi possível salvar a configuração.\n" + error.message);
            }
        }

        // ==================== FUNÇÕES DO CALENDÁRIO ====================
        function friendlyFirebaseError(error) {
            const code = error?.code || "";
            const messages = {
                "auth/invalid-email": "O e-mail informado é inválido.",
                "auth/missing-password": "Digite a senha.",
                "auth/invalid-credential": "E-mail ou senha incorretos.",
                "auth/user-not-found": "Usuário não encontrado.",
                "auth/wrong-password": "E-mail ou senha incorretos.",
                "auth/email-already-in-use": "Esse e-mail já possui uma conta.",
                "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
                "auth/too-many-requests": "Muitas tentativas. Aguarde alguns minutos e tente novamente.",
                "auth/network-request-failed": "Falha de conexão com o Firebase. Verifique a internet e tente novamente.",
                "permission-denied": "O usuário não tem permissão para acessar o Firestore. Confira as Regras do banco."
            };
            return messages[code] || error?.message || "Ocorreu um erro inesperado.";
        }

        function setAuthLoading(isLoading, action = "login") {
            loginBtn.disabled = isLoading;
            registerBtn.disabled = isLoading;
            loginBtn.innerText = isLoading && action === "login" ? "Carregando..." : "Entrar";
            registerBtn.innerText = isLoading && action === "register" ? "Cadastrando..." : "Criar Nova Conta";
        }

        function noteKey(year, month, day) {
            return `${year}_${month}_${day}`;
        }

        function calculateDaysFromAnchor(y,m,d) {
            const anchor = Date.UTC(2026,6,3);
            const target = Date.UTC(y,m,d);
            return Math.floor((target - anchor) / (1000*60*60*24));
        }

        function mathematicalMod(n,m) { return ((n%m)+m)%m; }

        function cleanStringForClass(text) {
            return text.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
        }

        function escapeHtml(text) {
            return String(text ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getWorkersForDate(year, month, day) {
            let activeWorkers = [], isDuty = false;
            const diff = calculateDaysFromAnchor(year, month, day);
            const pos = mathematicalMod(diff, 14);

            const rotation = staffConfig.rotation;
            const sabadoFixo = staffConfig.sabado_fixo;
            const domingoFixo = staffConfig.domingo_fixo;
            const quintaFixo = staffConfig.quinta_fixo;

            if (pos === 0 || pos === 1 || pos === 2) {
                isDuty = true;
                const weekendIdx = Math.floor((diff - pos) / 14);
                const offset = mathematicalMod(weekendIdx, rotation.length);
                const order = rotation.slice(offset).concat(rotation.slice(0, offset));

                if (pos === 0) {
                    activeWorkers.push(order[0], order[1]);
                } else if (pos === 1) {
                    activeWorkers.push(sabadoFixo, order[2]);
                } else if (pos === 2) {
                    activeWorkers.push(domingoFixo, order[3]);
                }
            } else if (pos === 6) {
                isDuty = true;
                activeWorkers.push(quintaFixo);
            }

            return { isDuty, activeWorkers };
        }

        function isPlantaoDia(year, month, day, isDutyOriginal) {
            return isDutyOriginal;
        }

        async function loadNotesFromServer() {
            if (!sessionUser) {
                // Se não tiver usuário, tenta carregar mesmo assim (leitura pública)
                try {
                    const snapshot = await getDocs(collection(db, "agenda"));
                    notesCache = {};
                    noteMetaCache = {};
                    snapshot.forEach(documentSnapshot => {
                        const item = documentSnapshot.data();
                        if (typeof item.nota === "string" && item.nota.trim()) {
                            notesCache[documentSnapshot.id] = item.nota;
                            noteMetaCache[documentSnapshot.id] = {
                                sequenceId: item.sequenceId || null
                            };
                        }
                    });
                } catch (error) {
                    console.error("Erro ao carregar anotações (leitura pública):", error);
                }
                buildCalendar();
                return;
            }

            try {
                const snapshot = await getDocs(collection(db, "agenda"));
                notesCache = {};
                noteMetaCache = {};
                snapshot.forEach(documentSnapshot => {
                    const item = documentSnapshot.data();
                    if (typeof item.nota === "string" && item.nota.trim()) {
                        notesCache[documentSnapshot.id] = item.nota;
                        noteMetaCache[documentSnapshot.id] = {
                            sequenceId: item.sequenceId || null
                        };
                    }
                });
                buildCalendar();
            } catch (error) {
                console.error("Erro ao carregar anotações:", error);
                alert("Não foi possível carregar as anotações.\n\n" + friendlyFirebaseError(error));
                buildCalendar();
            }
        }

        function saveNoteToServer(dayNum, text) {
            if (!sessionUser) return;

            const key = noteKey(activeYear, activeMonth, dayNum);
            notesCache[key] = text;

            if (saveTimers.has(key)) clearTimeout(saveTimers.get(key));

            const timer = setTimeout(async () => {
                try {
                    const ref = doc(db, "agenda", key);
                    if (!text.trim()) {
                        await deleteDoc(ref);
                        delete notesCache[key];
                        delete noteMetaCache[key];
                    } else {
                        await setDoc(ref, {
                            nota: text,
                            atualizadoPor: sessionUser.email || sessionUser.uid,
                            atualizadoPorUid: sessionUser.uid,
                            atualizadoEm: serverTimestamp(),
                            sequenceId: deleteField()
                        }, { merge: true });
                        noteMetaCache[key] = { sequenceId: null };
                    }
                } catch (error) {
                    console.error(`Erro ao salvar ${key}:`, error);
                    alert("Não foi possível salvar a anotação.\n\n" + friendlyFirebaseError(error));
                } finally {
                    saveTimers.delete(key);
                }
            }, 500);

            saveTimers.set(key, timer);
        }

        function dateFromNoteKey(key) {
            const [year, month, day] = key.split("_").map(Number);
            return new Date(year, month, day);
        }

        async function cancelConsecutiveReminder(startDay, text) {
            if (!sessionUser) return;

            const clickedKey = noteKey(activeYear, activeMonth, startDay);
            const targetText = String(text || "").trim();

            if (!targetText) {
                alert("Não há lembrete neste dia para cancelar.");
                return;
            }

            const sequenceId = noteMetaCache[clickedKey]?.sequenceId || null;
            let sequenceKeys = [];

            if (sequenceId) {
                sequenceKeys = Object.keys(notesCache).filter(key =>
                    noteMetaCache[key]?.sequenceId === sequenceId
                );
            } else {
                const clickedDate = new Date(activeYear, activeMonth, startDay);
                const startDate = new Date(clickedDate);

                while (true) {
                    const previousDate = new Date(startDate);
                    previousDate.setDate(previousDate.getDate() - 1);
                    const previousKey = noteKey(
                        previousDate.getFullYear(),
                        previousDate.getMonth(),
                        previousDate.getDate()
                    );
                    const previousText = String(notesCache[previousKey] || "").trim();
                    if (previousText !== targetText) break;
                    startDate.setTime(previousDate.getTime());
                }

                const cursor = new Date(startDate);
                for (let i = 0; i < 5000; i++) {
                    const key = noteKey(
                        cursor.getFullYear(),
                        cursor.getMonth(),
                        cursor.getDate()
                    );
                    const currentText = String(notesCache[key] || "").trim();
                    if (currentText !== targetText) break;
                    sequenceKeys.push(key);
                    cursor.setDate(cursor.getDate() + 1);
                }
            }

            sequenceKeys.sort((a, b) => dateFromNoteKey(a) - dateFromNoteKey(b));

            if (!sequenceKeys.length) {
                alert("Não foi possível localizar a sequência deste lembrete.");
                return;
            }

            const startDate = dateFromNoteKey(sequenceKeys[0]);
            const endDate = dateFromNoteKey(sequenceKeys[sequenceKeys.length - 1]);
            const total = sequenceKeys.length;
            const startLabel = startDate.toLocaleDateString("pt-BR");
            const endLabel = endDate.toLocaleDateString("pt-BR");

            const confirmed = confirm(
                `Cancelar este lembrete em ${total} dia${total === 1 ? "" : "s"} de uma só vez?\n\n` +
                `Período: ${startLabel} até ${endLabel}\n\n` +
                `Toda a sequência será apagada.`
            );

            if (!confirmed) return;

            try {
                sequenceKeys.forEach(key => {
                    if (saveTimers.has(key)) {
                        clearTimeout(saveTimers.get(key));
                        saveTimers.delete(key);
                    }
                });

                for (let i = 0; i < sequenceKeys.length; i += 500) {
                    const batch = writeBatch(db);
                    const chunk = sequenceKeys.slice(i, i + 500);
                    chunk.forEach(key => batch.delete(doc(db, "agenda", key)));
                    await batch.commit();
                }

                sequenceKeys.forEach(key => {
                    delete notesCache[key];
                    delete noteMetaCache[key];
                });

                buildCalendar();
                alert(`Lembrete cancelado em ${total} dia${total === 1 ? "" : "s"} de uma só vez.`);
            } catch (error) {
                console.error("Erro ao cancelar sequência:", error);
                alert("Não foi possível cancelar toda a sequência.\n\n" + friendlyFirebaseError(error));
            }
        }

        async function replicateNoteInBulk(startDay, text) {
            if (!sessionUser) return;

            const isEmpty = !text.trim();
            const promptMsg = isEmpty
                ? "O campo está vazio. Digite a quantidade de dias corridos para a frente (incluindo hoje) que você deseja APAGAR/LIMPAR:"
                : "Deseja REPLICAR esta anotação por quantos dias corridos para frente (incluindo hoje)?";

            const promptDays = prompt(promptMsg, "10");
            if (!promptDays) return;

            const totalDaysToApply = parseInt(promptDays, 10);
            if (isNaN(totalDaysToApply) || totalDaysToApply <= 0) return alert("Por favor, digite um número de dias válido.");
            if (totalDaysToApply > 500) return alert("Por segurança, replique no máximo 500 dias por vez.");

            const currentDateObj = new Date(activeYear, activeMonth, startDay);
            const batch = writeBatch(db);
            const sequenceId = isEmpty
                ? null
                : (crypto.randomUUID ? crypto.randomUUID() : `seq_${Date.now()}_${Math.random().toString(36).slice(2)}`);

            for (let i = 0; i < totalDaysToApply; i++) {
                const targetYear = currentDateObj.getFullYear();
                const targetMonth = currentDateObj.getMonth();
                const targetDay = currentDateObj.getDate();
                const key = noteKey(targetYear, targetMonth, targetDay);
                const ref = doc(db, "agenda", key);

                if (isEmpty) {
                    batch.delete(ref);
                    delete notesCache[key];
                    delete noteMetaCache[key];
                } else {
                    notesCache[key] = text;
                    noteMetaCache[key] = { sequenceId };
                    batch.set(ref, {
                        nota: text,
                        atualizadoPor: sessionUser.email || sessionUser.uid,
                        atualizadoPorUid: sessionUser.uid,
                        atualizadoEm: serverTimestamp(),
                        sequenceId: sequenceId
                    }, { merge: true });
                }

                currentDateObj.setDate(currentDateObj.getDate() + 1);
            }

            try {
                await batch.commit();
                buildCalendar();
                alert(isEmpty ? "Anotações apagadas com sucesso!" : "Anotações replicadas com sucesso!");
            } catch (error) {
                console.error("Erro ao atualizar o banco:", error);
                alert("Erro ao atualizar o banco:\n\n" + friendlyFirebaseError(error));
            }
        }

        function buildCalendar() {
            const firstDay = new Date(activeYear, activeMonth, 1).getDay();
            const daysInMonth = new Date(activeYear, activeMonth+1, 0).getDate();
            const today = new Date();
            const isEditable = !!sessionUser;

            document.getElementById("month-label").innerText = monthNamesList[activeMonth];
            document.getElementById("year-label").innerText = activeYear;
            monthSelect.value = String(activeMonth);
            if (activeYear >= 2026 && activeYear <= 2035) yearSelect.value = String(activeYear);

            const tbody = document.getElementById("calendar-table-body");
            const listView = document.getElementById("main-list-view");
            tbody.innerHTML = "";
            listView.innerHTML = "";
            let dayNum = 1;

            for (let w=0; w<6; w++) {
                const tr = document.createElement("tr");
                let hasData = false;

                for (let d=0; d<7; d++) {
                    const td = document.createElement("td");

                    if ((w===0 && d<firstDay) || dayNum > daysInMonth) {
                        td.className = "empty-cell";
                    } else {
                        hasData = true;
                        const currentDayNum = dayNum;
                        const isToday = currentDayNum === today.getDate() && activeYear === today.getFullYear() && activeMonth === today.getMonth();

                        const { isDuty, activeWorkers } = getWorkersForDate(activeYear, activeMonth, currentDayNum);
                        const isPlantao = isPlantaoDia(activeYear, activeMonth, currentDayNum, isDuty);

                        if (isPlantao) td.classList.add("plantao-cell");
                        if (isToday) td.classList.add("today-cell");

                        const savedNote = notesCache[noteKey(activeYear, activeMonth, currentDayNum)] || "";
                        if (savedNote.trim() && !isToday && !isPlantao) td.classList.add("annotated-cell");

                        let html = `<div class="date-row">`;
                        html += isDuty ? `<div class="duty-day-circle">${currentDayNum}</div>` : `<div class="date-num">${currentDayNum}</div>`;
                        html += `</div>`;
                        if (isPlantao) html += `<span class="plantao-label">Plantão</span>`;
                        html += `<div class="badges-list">`;
                        activeWorkers.forEach(worker => {
                            const cls = cleanStringForClass(worker);
                            html += `<span class="badge b-${cls}">${escapeHtml(worker)}</span>`;
                        });
                        html += `</div>`;

                        if (isEditable) {
                            html += `<textarea class="agenda-input" data-day="${currentDayNum}" placeholder="Anotar..." title="Duplo clique para replicar. Use Cancelar lembrete para apagar toda a sequência de uma só vez.">${escapeHtml(savedNote)}</textarea>`;
                            html += `<button type="button" class="cancel-sequence-btn" style="display:${savedNote.trim() ? 'block' : 'none'}">Cancelar lembrete</button>`;
                        } else {
                            if (savedNote.trim()) {
                                html += `<div class="readonly-note" style="font-size:12px; color:#333; margin-top:4px; background:#f1f5f9; padding:4px 6px; border-radius:4px;">${escapeHtml(savedNote)}</div>`;
                            }
                        }

                        td.innerHTML = html;

                        if (isEditable) {
                            const tx = td.querySelector('.agenda-input');
                            const cancelBtn = td.querySelector('.cancel-sequence-btn');
                            if (tx) {
                                tx.oninput = e => {
                                    const val = e.target.value;
                                    saveNoteToServer(currentDayNum, val);
                                    if (val.trim()) {
                                        if (!isToday && !isPlantao) td.classList.add("annotated-cell");
                                        cancelBtn.style.display = "block";
                                    } else {
                                        td.classList.remove("annotated-cell");
                                        cancelBtn.style.display = "none";
                                    }

                                    const mobileTx = listView.querySelector(`textarea[data-mobile-day="${currentDayNum}"]`);
                                    if (mobileTx && mobileTx.value !== val) mobileTx.value = val;

                                    const mobileCancelBtn = listView.querySelector(`button[data-mobile-cancel-day="${currentDayNum}"]`);
                                    if (mobileCancelBtn) mobileCancelBtn.style.display = val.trim() ? "block" : "none";
                                };

                                tx.ondblclick = e => replicateNoteInBulk(currentDayNum, e.target.value);
                            }
                            if (cancelBtn) {
                                cancelBtn.onclick = () => cancelConsecutiveReminder(currentDayNum, tx?.value || '');
                            }
                        }

                        // Versão mobile (lista)
                        const card = document.createElement("div");
                        card.className = `mobile-card ${isPlantao ? 'plantao-card' : ''} ${isToday ? 'today-card' : ''}`;
                        if (savedNote.trim() && !isToday && !isPlantao) card.classList.add("annotated-card");

                        let cardHtml = `
                            <div class="mobile-card-header">
                                <div class="mobile-card-date">
                                    <div class="mobile-day-name">${dayNamesList[d]}</div>
                                    ${isDuty ? `<div class="duty-day-circle">${currentDayNum}</div>` : `<div class="date-num">${currentDayNum}</div>`}
                                    ${isPlantao ? `<span class="plantao-label">Plantão</span>` : ''}
                                </div>
                                <div class="badges-list">
                        `;
                        activeWorkers.forEach(worker => {
                            const cls = cleanStringForClass(worker);
                            cardHtml += `<span class="badge b-${cls}">${escapeHtml(worker)}</span>`;
                        });
                        cardHtml += `</div></div>`;

                        if (isEditable) {
                            cardHtml += `<textarea class="agenda-input" data-mobile-day="${currentDayNum}" placeholder="Anotar..." title="Duplo clique para replicar. Use Cancelar lembrete para apagar toda a sequência de uma só vez.">${escapeHtml(savedNote)}</textarea>`;
                            cardHtml += `<button type="button" class="cancel-sequence-btn" data-mobile-cancel-day="${currentDayNum}" style="display:${savedNote.trim() ? 'block' : 'none'}">Cancelar lembrete</button>`;
                        } else {
                            if (savedNote.trim()) {
                                cardHtml += `<div class="readonly-note" style="font-size:12px; color:#333; margin-top:4px; background:#f1f5f9; padding:4px 6px; border-radius:4px;">${escapeHtml(savedNote)}</div>`;
                            }
                        }

                        card.innerHTML = cardHtml;

                        if (isEditable) {
                            const mobileTx = card.querySelector('.agenda-input');
                            const mobileCancelBtn = card.querySelector('.cancel-sequence-btn');
                            if (mobileTx) {
                                mobileTx.oninput = e => {
                                    const val = e.target.value;
                                    saveNoteToServer(currentDayNum, val);

                                    if (val.trim()) {
                                        if (!isToday && !isPlantao) card.classList.add("annotated-card");
                                        mobileCancelBtn.style.display = "block";
                                    } else {
                                        card.classList.remove("annotated-card");
                                        mobileCancelBtn.style.display = "none";
                                    }

                                    const desktopTx = tbody.querySelector(`textarea[data-day="${currentDayNum}"]`);
                                    if (desktopTx) {
                                        desktopTx.value = val;
                                        const parentTd = desktopTx.closest('td');
                                        if (parentTd && !isToday) {
                                            if (val.trim()) parentTd.classList.add("annotated-cell");
                                            else parentTd.classList.remove("annotated-cell");
                                        }

                                        const desktopCancelBtn = parentTd?.querySelector('.cancel-sequence-btn');
                                        if (desktopCancelBtn) desktopCancelBtn.style.display = val.trim() ? "block" : "none";
                                    }
                                };

                                mobileTx.ondblclick = e => replicateNoteInBulk(currentDayNum, e.target.value);
                            }
                            if (mobileCancelBtn) {
                                mobileCancelBtn.onclick = () => cancelConsecutiveReminder(currentDayNum, mobileTx?.value || '');
                            }
                        }

                        listView.appendChild(card);
                        dayNum++;
                    }

                    tr.appendChild(td);
                }

                if (hasData) tbody.appendChild(tr);
                if (dayNum > daysInMonth) break;
            }
        }

        // ==================== AUTENTICAÇÃO ====================
        async function doLogin() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) return alert("Preencha todos os campos!");

            setAuthLoading(true, "login");
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error("Erro no login Firebase:", error);
                alert("Erro ao entrar: " + friendlyFirebaseError(error));
            } finally {
                setAuthLoading(false);
            }
        }

        async function doRegister() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) return alert("Preencha o e-mail e a senha que deseja cadastrar!");
            if (password.length < 6) return alert("A senha precisa ter pelo menos 6 caracteres!");

            setAuthLoading(true, "register");
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("Conta criada com sucesso! Você já está conectado.");
            } catch (error) {
                console.error("Erro no cadastro Firebase:", error);
                alert("Erro ao criar conta: " + friendlyFirebaseError(error));
            } finally {
                setAuthLoading(false);
            }
        }

        loginBtn.onclick = doLogin;
        registerBtn.onclick = doRegister;
        passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

        logoutBtn.onclick = async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Erro no logout Firebase:", error);
                alert("Não foi possível sair: " + friendlyFirebaseError(error));
            }
        };

        // ==================== EVENTO DE EDIÇÃO DA ESCALA ====================
        document.getElementById("edit-staff-btn").addEventListener("click", async () => {
            if (!sessionUser) {
                alert("Você precisa estar logado para editar a escala.");
                return;
            }

            const r0 = prompt("1º nome do rodízio (ex: Carlos):", staffConfig.rotation[0]);
            if (r0 === null) return;
            const r1 = prompt("2º nome do rodízio (ex: Leticia):", staffConfig.rotation[1]);
            if (r1 === null) return;
            const r2 = prompt("3º nome do rodízio (ex: Gustavo):", staffConfig.rotation[2]);
            if (r2 === null) return;
            const r3 = prompt("4º nome do rodízio (ex: Tatiane):", staffConfig.rotation[3]);
            if (r3 === null) return;

            const sabado = prompt("Nome fixo para os SÁBADOS (antes era Felipe):", staffConfig.sabado_fixo);
            if (sabado === null) return;
            const domingo = prompt("Nome fixo para os DOMINGOS (antes era Júlio):", staffConfig.domingo_fixo);
            if (domingo === null) return;
            const quinta = prompt("Nome fixo para as QUINTAS-FEIRAS (antes era Leandro):", staffConfig.quinta_fixo);
            if (quinta === null) return;

            const newRotation = [r0.trim(), r1.trim(), r2.trim(), r3.trim()];
            const newSabado = sabado.trim();
            const newDomingo = domingo.trim();
            const newQuinta = quinta.trim();

            await saveStaffConfig(newRotation, newSabado, newDomingo, newQuinta);
            alert("✅ Escala atualizada com sucesso!");
        });

        // ==================== NAVEGAÇÃO DO CALENDÁRIO ====================
        document.getElementById("view-grid-btn").onclick = () => {
            currentViewMode = "grid";
            document.getElementById("main-grid-view").style.display = "table";
            document.getElementById("main-list-view").style.display = "none";
            document.getElementById("view-grid-btn").classList.add("active");
            document.getElementById("view-list-btn").classList.remove("active");
        };

        document.getElementById("view-list-btn").onclick = () => {
            currentViewMode = "list";
            document.getElementById("main-grid-view").style.display = "none";
            document.getElementById("main-list-view").style.display = "flex";
            document.getElementById("view-list-btn").classList.add("active");
            document.getElementById("view-grid-btn").classList.remove("active");
        };

        document.getElementById("btn-prev-month").onclick = () => {
            activeMonth--;
            if (activeMonth < 0) { activeMonth = 11; activeYear--; }
            if (activeYear < 2026) { activeYear = 2026; activeMonth = 0; }
            buildCalendar();
        };

        document.getElementById("btn-next-month").onclick = () => {
            activeMonth++;
            if (activeMonth > 11) { activeMonth = 0; activeYear++; }
            if (activeYear > 2035) { activeYear = 2035; activeMonth = 11; }
            buildCalendar();
        };

        document.getElementById("jump-submit-btn").onclick = () => {
            activeMonth = parseInt(monthSelect.value, 10);
            activeYear = parseInt(yearSelect.value, 10);
            buildCalendar();
        };

        // ==================== INICIALIZAÇÃO ====================
        onAuthStateChanged(auth, async (user) => {
            await loadStaffConfig();

            if (user) {
                sessionUser = user;
                authScreen.style.display = "none";
                calendarScreen.style.display = "flex";
                document.getElementById("edit-staff-btn").style.display = "inline-block";
            } else {
                sessionUser = null;
                authScreen.style.display = "flex";
                calendarScreen.style.display = "flex";
                document.getElementById("edit-staff-btn").style.display = "none";
            }

            await loadNotesFromServer();
        });
    </script>
