<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Visualização - Plantão</title>
    <style>
        :root {
            --rio-blue: #002D5E;
            --rio-light: #004A8D;
            --accent-bronze: #8C6239;
            --bg-body: #F4F7FA;
            --bg-card: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --bg-annotated: #F0FDF4;
            --border-annotated: #BBF7D0;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .calendar-container {
            width: 100%;
            max-width: 1000px;
            background-color: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            position: relative;
        }
        .top-bar-header {
            background-color: var(--rio-blue);
            color: #FFF;
            text-align: center;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
        }
        .top-bar-header .view-badge {
            position: absolute;
            right: 14px; top: 11px;
            background: rgba(255,255,255,0.2);
            color: #FFF;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: #FFF;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }
        .title-block { position: relative; width: 100%; }
        .title-block .month-title { font-size: 36px; font-weight: 800; color: var(--rio-blue); text-transform: uppercase; }
        .title-block .year-title { font-size: 15px; color: var(--accent-bronze); font-weight: 700; letter-spacing: 6px; margin-top: 4px; }

        .readonly-banner {
            background: #FEF3C7;
            border: 1px solid #F59E0B;
            color: #92400E;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }

        .toolbar {
            display: flex; flex-wrap: wrap; gap: 12px; width: 100%; justify-content: center; align-items: center;
            background: #F8FAFC; padding: 14px 20px; border-bottom: 1px solid var(--border-color);
        }
        .nav-controls, .view-controls, .search-control, .jump-control { display: flex; align-items: center; gap: 6px; }
        .toolbar select, .toolbar input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 20px; font-size: 13px; background: #FFF; }
        
        .btn-action {
            background-color: #FFF; color: var(--rio-blue); border: 1.5px solid var(--rio-blue);
            padding: 8px 16px; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 20px; transition: all 0.2s ease; text-transform: uppercase;
        }
        .btn-action:hover, .btn-action.active { background-color: var(--rio-blue); color: #FFF; }

        .calendar-content { 
            padding: 12px; 
            width: 100%;
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch;
        }
        .calendar-grid-table { 
            width: 100%; 
            min-width: 900px; 
            border-collapse: separate; 
            border-spacing: 0; 
            table-layout: fixed; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            overflow: hidden; 
        }
        .calendar-grid-table th { background-color: var(--rio-blue); color: #FFF; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 10px 4px; text-align: center; }
        .calendar-grid-table td { border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); vertical-align: top; padding: 6px 4px; height: 135px; background-color: #FFF; position: relative; transition: background-color 0.2s, border-color 0.2s; }
        .calendar-grid-table .empty-cell { background-color: #F8FAFC; }
        
        .calendar-grid-table td.annotated-cell { background-color: var(--bg-annotated) !important; border-color: var(--border-annotated) !important; box-shadow: inset 0 0 0 1px var(--border-annotated); }
        .mobile-card.annotated-card { background-color: var(--bg-annotated) !important; border-color: var(--border-annotated) !important; }

        :root {
            --plantao-bg: #EAF4FF;
            --plantao-border: #C9DDF5;
            --plantao-text: #315F8C;
        }

        .calendar-grid-table td.plantao-cell {
            background-color: var(--plantao-bg) !important;
            border-color: var(--plantao-border) !important;
            box-shadow: inset 0 0 0 1px var(--plantao-border);
        }
        .calendar-grid-table td.plantao-cell.weekday-plantao {
            background-color: #E8F5E9 !important;
            border-color: #A5D6A7 !important;
        }

        .plantao-label {
            display: block;
            margin-top: 4px;
            margin-bottom: 5px;
            font-size: 10px;
            line-height: 1.2;
            font-weight: 900;
            color: var(--plantao-text);
            letter-spacing: 0.9px;
            text-align: right;
            text-transform: uppercase;
        }
        .plantao-label.weekday-label {
            color: #2E7D32;
        }

        .mobile-card.plantao-card {
            background-color: var(--plantao-bg) !important;
            border-color: var(--plantao-border) !important;
        }
        .mobile-card.plantao-card.weekday-plantao {
            background-color: #E8F5E9 !important;
            border-color: #A5D6A7 !important;
        }

        .mobile-card .plantao-label {
            margin: 0 0 0 6px;
            text-align: left;
            align-self: center;
        }

        .date-row { display: flex; justify-content: flex-end; margin-bottom: 4px; }
        .date-num { font-weight: 700; font-size: 11px; color: #94A3B8; }
        .duty-day-circle { width: 22px; height: 22px; border: 2px solid var(--rio-light); background: transparent; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--rio-light); font-size: 10px; font-weight: 800; }
        
        .mobile-list-view { display: none; flex-direction: column; gap: 10px; padding: 8px; width: 100%; }
        .mobile-card { background: #FFF; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; transition: background-color 0.2s, border-color 0.2s; }
        .mobile-card-header { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .mobile-card-date { display: flex; align-items: center; gap: 8px; }
        .mobile-day-name { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        
        .badges-list { display: flex; flex-direction: column; gap: 3px; width: 100%; }
        .badge { 
            font-size: 9px; 
            font-weight: 800; 
            color: #FFF; 
            padding: 2px 4px; 
            border-radius: 4px; 
            text-transform: uppercase; 
            text-align: center; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
        }
        .badge-coringa {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9) !important;
            border: 1px solid #5B21B6;
        }
        
        .today-cell { background-color: #FFFBEB !important; border: 2px solid #F59E0B !important; box-shadow: none !important; }
        .today-card { border: 2px solid #F59E0B !important; background-color: #FFFBEB !important; }
        
        footer { padding: 16px 20px; background-color: #F8FAFC; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .legend-container { display: flex; gap: 14px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .l-dot { width: 10px; height: 10px; border-radius: 50%; }
        .l-active { background: var(--rio-light); border: 2px solid var(--rio-light); }
        .l-coringa { background: linear-gradient(135deg, #8B5CF6, #6D28D9); border: 1px solid #5B21B6; }
        .l-today { background-color: #FFFBEB; border: 2px solid #F59E0B; }
        .l-annotated { background-color: var(--bg-annotated); border: 1px solid var(--border-annotated); }

        .readonly-note {
            font-size: 12px;
            color: #333;
            margin-top: 4px;
            background: #f1f5f9;
            padding: 4px 6px;
            border-radius: 4px;
            border-left: 3px solid #94A3B8;
        }

        /* Cores fixas para nomes */
        .badge-color-0 { background-color: #3B82F6; }
        .badge-color-1 { background-color: #10B981; }
        .badge-color-2 { background-color: #F59E0B; }
        .badge-color-3 { background-color: #EF4444; }
        .badge-color-4 { background-color: #8B5CF6; }
        .badge-color-5 { background-color: #EC4899; }
        .badge-color-6 { background-color: #14B8A6; }
        .badge-color-7 { background-color: #F97316; }
        .badge-color-8 { background-color: #6366F1; }
        .badge-color-9 { background-color: #84CC16; }
    </style>
</head>
<body>

    <div class="calendar-container" id="calendar-screen">
        <div class="top-bar-header">
            📅 Plantão
            <span class="view-badge">👁️ Visualização</span>
        </div>
        <header>
            <div class="title-block">
                <div class="month-title" id="month-label">Julho</div>
                <div class="year-title" id="year-label">2026</div>
            </div>
            <div class="readonly-banner">🔒 Modo de visualização — sem login, sem edição</div>
        </header>

        <div class="toolbar">
            <div class="nav-controls">
                <button class="btn-action" id="btn-prev-month">« Ant</button>
                <button class="btn-action" id="btn-next-month">Próx »</button>
            </div>
            <div class="view-controls">
                <button class="btn-action active" id="view-grid-btn">Calendário</button>
                <button class="btn-action" id="view-list-btn">Lista</button>
            </div>
            <div class="jump-control">
                <select id="jump-month-select">
                    <option value="0">Janeiro</option><option value="1">Fevereiro</option><option value="2">Março</option>
                    <option value="3">Abril</option><option value="4">Maio</option><option value="5">Junho</option>
                    <option value="6" selected>Julho</option><option value="7">Agosto</option><option value="8">Setembro</option>
                    <option value="9">Outubro</option><option value="10">Novembro</option><option value="11">Dezembro</option>
                </select>
                <select id="jump-year-select"></select>
                <button class="btn-action" id="jump-submit-btn">Ir</button>
            </div>
        </div>

        <div class="calendar-content">
            <table class="calendar-grid-table" id="main-grid-view">
                <thead><tr><th>Dom</th><th>Seg</th><th>Ter</th><th>Qua</th><th>Qui</th><th>Sex</th><th>Sáb</th></tr></thead>
                <tbody id="calendar-table-body"></tbody>
            </table>
            <div class="mobile-list-view" id="main-list-view"></div>
        </div>

        <footer>
            <div class="legend-container">
                <div class="legend-item"><div class="l-dot l-active"></div> Plantão</div>
                <div class="legend-item"><div class="l-dot l-coringa"></div> Coringa</div>
                <div class="legend-item"><div class="l-dot l-today"></div> Hoje</div>
                <div class="legend-item"><div class="l-dot l-annotated"></div> Com Anotação</div>
            </div>
            <span class="credit-footer">Desenvolvido por <strong>Felipe Souza</strong></span>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import {
            getFirestore,
            collection,
            doc,
            getDocs,
            getDoc,
            setDoc,
            deleteDoc,
            deleteField,
            writeBatch,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyAWzxdzAi8u0oz-NFQcTxxwt6kI-8y72hQ",
            authDomain: "escalaaberta-d968c.firebaseapp.com",
            projectId: "escalaaberta-d968c",
            storageBucket: "escalaaberta-d968c.firebasestorage.app",
            messagingSenderId: "259093020146",
            appId: "1:259093020146:web:86ea2cbf2789e0937f3f6b",
            measurementId: "G-ETSK8NEHDF"
        };
        // ========================================================

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Forçamos o modo visualização (sem login)
        const sessionUser = null;
        let notesCache = {};
        let noteMetaCache = {};

        // Configuração da escala (vem do Firestore)
        let staffConfig = {
            rotation: ["Carlos", "Leticia", "Gustavo", "Tatiane"],
            quinta: ["Leandro"],
            excecoes: {},
            quantidades: {
                sexta: 1,
                sabado: 1,
                domingo: 1
            }
        };

        const monthNamesList = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
        const dayNamesList = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

        const todayInitial = new Date();
        let activeMonth = todayInitial.getMonth();
        let activeYear = Math.min(Math.max(todayInitial.getFullYear(), 2026), 2035);
        let currentViewMode = "grid";

        const yearSelect = document.getElementById("jump-year-select");
        for (let y = 2026; y <= 2035; y++) {
            const opt = document.createElement("option");
            opt.value = y;
            opt.innerText = y;
            yearSelect.appendChild(opt);
        }

        const monthSelect = document.getElementById("jump-month-select");
        monthSelect.value = String(activeMonth);
        yearSelect.value = String(activeYear);

        // ==================== FUNÇÕES DE CONFIGURAÇÃO ====================
        async function loadStaffConfig() {
            try {
                const docRef = doc(db, "config", "staff");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    staffConfig.rotation = data.rotation || staffConfig.rotation;
                    staffConfig.quinta = data.quinta || staffConfig.quinta;
                    staffConfig.excecoes = data.excecoes || {};
                    staffConfig.quantidades = data.quantidades || { sexta:1, sabado:1, domingo:1 };
                } else {
                    // Se não existir, usa os padrões (não vamos salvar porque é visualização)
                    console.warn("Configuração não encontrada, usando padrões.");
                }
            } catch (error) {
                console.error("Erro ao carregar configuração:", error);
            }
        }

        // ==================== FUNÇÕES DO CALENDÁRIO ====================
        function mathematicalMod(n,m) { return ((n%m)+m)%m; }

        function cleanStringForClass(text) {
            return text.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
        }

        function escapeHtml(text) {
            return String(text ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Mapa de cores fixas para cada nome (baseado no nome)
        const colorPalette = [
            '#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6',
            '#EC4899', '#14B8A6', '#F97316', '#6366F1', '#84CC16'
        ];
        const colorMap = {};
        let colorIndex = 0;

        function getColorForName(name) {
            if (!name) return '#6B7280';
            const trimmed = name.trim();
            if (!trimmed) return '#6B7280';
            if (colorMap[trimmed]) return colorMap[trimmed];
            const color = colorPalette[colorIndex % colorPalette.length];
            colorMap[trimmed] = color;
            colorIndex++;
            return color;
        }

        function calculateDaysFromAnchor(y,m,d) {
            const anchor = Date.UTC(2026,6,3);
            const target = Date.UTC(y,m,d);
            return Math.floor((target - anchor) / (1000*60*60*24));
        }

        function getWorkersForDate(year, month, day) {
            let activeWorkers = [];
            let isDuty = false;
            const diff = calculateDaysFromAnchor(year, month, day);
            const pos = mathematicalMod(diff, 14);

            const rotation = staffConfig.rotation || [];
            const quintaList = staffConfig.quinta || [];
            const excecoes = staffConfig.excecoes || {};
            const qtd = staffConfig.quantidades || { sexta:1, sabado:1, domingo:1 };

            const dayOfWeek = new Date(year, month, day).getDay();
            const excecaoNomes = excecoes[dayOfWeek] || [];

            let isPlantaoRegra = false;
            let posTipo = null;

            if (pos === 6) {
                isPlantaoRegra = true;
                posTipo = 'quinta';
            } else if (pos === 7) {
                isPlantaoRegra = true;
                posTipo = 'sexta';
            } else if (pos === 8) {
                isPlantaoRegra = true;
                posTipo = 'sabado';
            } else if (pos === 9) {
                isPlantaoRegra = true;
                posTipo = 'domingo';
            }

            if (isPlantaoRegra) {
                isDuty = true;
                if (posTipo === 'quinta') {
                    activeWorkers.push(...quintaList);
                } else {
                    if (rotation.length > 0) {
                        const weekendIdx = Math.floor((diff - pos) / 14);
                        let offset = mathematicalMod(weekendIdx, rotation.length);
                        if (posTipo === 'sexta') {
                            offset = mathematicalMod(weekendIdx, rotation.length);
                        } else if (posTipo === 'sabado') {
                            offset = mathematicalMod(weekendIdx + 1, rotation.length);
                        } else if (posTipo === 'domingo') {
                            offset = mathematicalMod(weekendIdx + 2, rotation.length);
                        }
                        let quantidade = 0;
                        if (posTipo === 'sexta') quantidade = Math.max(0, parseInt(qtd.sexta) || 1);
                        else if (posTipo === 'sabado') quantidade = Math.max(0, parseInt(qtd.sabado) || 1);
                        else if (posTipo === 'domingo') quantidade = Math.max(0, parseInt(qtd.domingo) || 1);
                        for (let i = 0; i < quantidade; i++) {
                            const idx = mathematicalMod(offset + i, rotation.length);
                            activeWorkers.push(rotation[idx]);
                        }
                    }
                }
            }

            if (isPlantaoRegra && excecaoNomes.length > 0) {
                activeWorkers.push(...excecaoNomes);
            }

            activeWorkers = [...new Set(activeWorkers)];
            return { isDuty, activeWorkers };
        }

        function isPlantaoDia(year, month, day, isDutyOriginal) {
            return isDutyOriginal;
        }

        async function loadNotesFromServer() {
            try {
                const snapshot = await getDocs(collection(db, "agenda"));
                notesCache = {};
                noteMetaCache = {};
                snapshot.forEach(documentSnapshot => {
                    const item = documentSnapshot.data();
                    if (typeof item.nota === "string" && item.nota.trim()) {
                        notesCache[documentSnapshot.id] = item.nota;
                        noteMetaCache[documentSnapshot.id] = {
                            sequenceId: item.sequenceId || null
                        };
                    }
                });
            } catch (error) {
                console.error("Erro ao carregar anotações:", error);
            }
            buildCalendar();
        }

        function buildCalendar() {
            const firstDay = new Date(activeYear, activeMonth, 1).getDay();
            const daysInMonth = new Date(activeYear, activeMonth+1, 0).getDate();
            const today = new Date();
            const isEditable = false; // SEMPRE visualização

            document.getElementById("month-label").innerText = monthNamesList[activeMonth];
            document.getElementById("year-label").innerText = activeYear;
            monthSelect.value = String(activeMonth);
            if (activeYear >= 2026 && activeYear <= 2035) yearSelect.value = String(activeYear);

            const tbody = document.getElementById("calendar-table-body");
            const listView = document.getElementById("main-list-view");
            tbody.innerHTML = "";
            listView.innerHTML = "";
            let dayNum = 1;

            const isWeekend = (dayOfWeek) => dayOfWeek === 0 || dayOfWeek === 6;

            for (let w=0; w<6; w++) {
                const tr = document.createElement("tr");
                let hasData = false;

                for (let d=0; d<7; d++) {
                    const td = document.createElement("td");

                    if ((w===0 && d<firstDay) || dayNum > daysInMonth) {
                        td.className = "empty-cell";
                    } else {
                        hasData = true;
                        const currentDayNum = dayNum;
                        const isToday = currentDayNum === today.getDate() && activeYear === today.getFullYear() && activeMonth === today.getMonth();

                        const { isDuty, activeWorkers } = getWorkersForDate(activeYear, activeMonth, currentDayNum);
                        const isPlantao = isPlantaoDia(activeYear, activeMonth, currentDayNum, isDuty);
                        const dayOfWeek = new Date(activeYear, activeMonth, currentDayNum).getDay();
                        const isWeekendDay = isWeekend(dayOfWeek);

                        if (isPlantao) {
                            td.classList.add("plantao-cell");
                            if (!isWeekendDay) td.classList.add("weekday-plantao");
                        }
                        if (isToday) td.classList.add("today-cell");

                        const savedNote = notesCache[noteKey(activeYear, activeMonth, currentDayNum)] || "";
                        if (savedNote.trim() && !isToday && !isPlantao) td.classList.add("annotated-cell");

                        let html = `<div class="date-row">`;
                        html += isDuty ? `<div class="duty-day-circle">${currentDayNum}</div>` : `<div class="date-num">${currentDayNum}</div>`;
                        html += `</div>`;
                        if (isPlantao) {
                            const labelClass = !isWeekendDay ? 'weekday-label' : '';
                            html += `<span class="plantao-label ${labelClass}">Plantão</span>`;
                        }
                        html += `<div class="badges-list">`;
                        if (activeWorkers.length === 0) {
                            html += `<span style="font-size:9px; color:#94A3B8;">(vazio)</span>`;
                        } else {
                            const excecaoNomes = staffConfig.excecoes[dayOfWeek] || [];
                            activeWorkers.forEach(worker => {
                                const isCoringa = excecaoNomes.includes(worker);
                                const color = getColorForName(worker);
                                const coringaClass = isCoringa ? 'badge-coringa' : '';
                                html += `<span class="badge ${coringaClass}" style="background-color:${color};">${escapeHtml(worker)}</span>`;
                            });
                        }
                        html += `</div>`;

                        // Modo somente leitura
                        if (savedNote.trim()) {
                            html += `<div class="readonly-note">${escapeHtml(savedNote)}</div>`;
                        }

                        td.innerHTML = html;

                        // Versão mobile (lista)
                        const card = document.createElement("div");
                        card.className = `mobile-card ${isPlantao ? 'plantao-card' : ''} ${isToday ? 'today-card' : ''}`;
                        if (isPlantao && !isWeekendDay) card.classList.add('weekday-plantao');
                        if (savedNote.trim() && !isToday && !isPlantao) card.classList.add("annotated-card");

                        let cardHtml = `
                            <div class="mobile-card-header">
                                <div class="mobile-card-date">
                                    <div class="mobile-day-name">${dayNamesList[d]}</div>
                                    ${isDuty ? `<div class="duty-day-circle">${currentDayNum}</div>` : `<div class="date-num">${currentDayNum}</div>`}
                                    ${isPlantao ? `<span class="plantao-label ${!isWeekendDay ? 'weekday-label' : ''}">Plantão</span>` : ''}
                                </div>
                                <div class="badges-list">
                        `;
                        if (activeWorkers.length === 0) {
                            cardHtml += `<span style="font-size:9px; color:#94A3B8;">(vazio)</span>`;
                        } else {
                            const excecaoNomes = staffConfig.excecoes[dayOfWeek] || [];
                            activeWorkers.forEach(worker => {
                                const isCoringa = excecaoNomes.includes(worker);
                                const color = getColorForName(worker);
                                const coringaClass = isCoringa ? 'badge-coringa' : '';
                                cardHtml += `<span class="badge ${coringaClass}" style="background-color:${color};">${escapeHtml(worker)}</span>`;
                            });
                        }
                        cardHtml += `</div></div>`;
                        if (savedNote.trim()) {
                            cardHtml += `<div class="readonly-note">${escapeHtml(savedNote)}</div>`;
                        }

                        card.innerHTML = cardHtml;
                        listView.appendChild(card);
                        dayNum++;
                    }

                    tr.appendChild(td);
                }

                if (hasData) tbody.appendChild(tr);
                if (dayNum > daysInMonth) break;
            }
        }

        function noteKey(year, month, day) {
            return `${year}_${month}_${day}`;
        }

        // ==================== NAVEGAÇÃO ====================
        document.getElementById("view-grid-btn").onclick = () => {
            currentViewMode = "grid";
            document.getElementById("main-grid-view").style.display = "table";
            document.getElementById("main-list-view").style.display = "none";
            document.getElementById("view-grid-btn").classList.add("active");
            document.getElementById("view-list-btn").classList.remove("active");
        };

        document.getElementById("view-list-btn").onclick = () => {
            currentViewMode = "list";
            document.getElementById("main-grid-view").style.display = "none";
            document.getElementById("main-list-view").style.display = "flex";
            document.getElementById("view-list-btn").classList.add("active");
            document.getElementById("view-grid-btn").classList.remove("active");
        };

        document.getElementById("btn-prev-month").onclick = () => {
            activeMonth--;
            if (activeMonth < 0) { activeMonth = 11; activeYear--; }
            if (activeYear < 2026) { activeYear = 2026; activeMonth = 0; }
            buildCalendar();
        };

        document.getElementById("btn-next-month").onclick = () => {
            activeMonth++;
            if (activeMonth > 11) { activeMonth = 0; activeYear++; }
            if (activeYear > 2035) { activeYear = 2035; activeMonth = 11; }
            buildCalendar();
        };

        document.getElementById("jump-submit-btn").onclick = () => {
            activeMonth = parseInt(monthSelect.value, 10);
            activeYear = parseInt(yearSelect.value, 10);
            buildCalendar();
        };

        // ==================== INICIALIZAÇÃO ====================
        async function init() {
            await loadStaffConfig();
            await loadNotesFromServer();
        }

        init();
    </script>
</body>
</html>
