<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Plantão - Visualização</title>
    <style>
        /* ========== RESET E BASE ========== */
        :root {
            --rio-blue: #002D5E;
            --rio-light: #004A8D;
            --accent-bronze: #8C6239;
            --bg-body: #F4F7FA;
            --bg-card: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --bg-annotated: #F0FDF4;
            --border-annotated: #BBF7D0;
            --plantao-bg: #EAF4FF;
            --plantao-border: #C9DDF5;
            --plantao-text: #315F8C;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
        }

        /* ========== CALENDÁRIO ========== */
        .calendar-container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .top-bar-header {
            background-color: var(--rio-blue);
            color: #FFF;
            text-align: center;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
        }
        .badge-visualizacao {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 400;
            margin-left: 10px;
        }
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: #FFF;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .title-block { width: 100%; }
        .title-block .month-title { font-size: 32px; font-weight: 800; color: var(--rio-blue); text-transform: uppercase; }
        .title-block .year-title { font-size: 14px; color: var(--accent-bronze); font-weight: 700; letter-spacing: 4px; margin-top: 4px; }

        /* ========== TOOLBAR ========== */
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 10px; width: 100%; justify-content: center; align-items: center;
            background: #F8FAFC; padding: 14px 20px; border-bottom: 1px solid var(--border-color);
        }
        .nav-controls, .view-controls, .jump-control { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .toolbar select, .toolbar input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 20px; font-size: 14px; background: #FFF; }
        .btn-action {
            background-color: #FFF; color: var(--rio-blue); border: 1.5px solid var(--rio-blue);
            padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; border-radius: 20px; transition: all 0.2s ease; text-transform: uppercase;
            touch-action: manipulation;
        }
        .btn-action:hover, .btn-action.active { background-color: var(--rio-blue); color: #FFF; }

        /* ========== CALENDÁRIO GRADE ========== */
        .calendar-content { padding: 8px; width: 100%; overflow-x: auto; }
        .calendar-grid-table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            table-layout: fixed;
        }
        .calendar-grid-table th {
            background-color: var(--rio-blue);
            color: #FFF;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 8px 2px;
            text-align: center;
            border: 1px solid var(--rio-blue);
        }
        .calendar-grid-table td {
            border: 1px solid var(--border-color);
            vertical-align: top;
            padding: 6px 4px;
            height: auto;
            min-height: 90px;
            background-color: #FFF;
            transition: background-color 0.2s, border-color 0.2s;
            overflow: hidden;
            word-wrap: break-word;
        }
        .calendar-grid-table .empty-cell {
            background-color: #F8FAFC;
            min-height: 40px;
        }
        .calendar-grid-table td.plantao-cell {
            background-color: var(--plantao-bg) !important;
            border-color: var(--plantao-border) !important;
        }
        .calendar-grid-table td.annotated-cell {
            background-color: var(--bg-annotated) !important;
            border-color: var(--border-annotated) !important;
        }
        .calendar-grid-table td.today-cell {
            background-color: #FFFBEB !important;
            border: 2px solid #F59E0B !important;
        }

        .date-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .date-num {
            font-weight: 700;
            font-size: 13px;
            color: #94A3B8;
        }
        .duty-day-circle {
            width: 24px;
            height: 24px;
            border: 2px solid var(--rio-light);
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--rio-light);
            font-size: 11px;
            font-weight: 800;
            flex-shrink: 0;
        }
        .plantao-label {
            display: block;
            margin: 2px 0 4px 0;
            font-size: 10px;
            font-weight: 900;
            color: var(--plantao-text);
            letter-spacing: 0.8px;
            text-align: right;
            text-transform: uppercase;
        }
        .badges-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 2px;
            min-height: 24px;
        }
        .badge {
            font-size: 10px;
            font-weight: 700;
            color: #FFF;
            padding: 2px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            white-space: nowrap;
            display: inline-block;
            border: 2px solid rgba(255,255,255,0.2);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .badge-empty {
            font-size: 10px;
            color: #94A3B8;
            padding: 2px 4px;
            font-style: italic;
        }

        .note-preview {
            font-size: 12px;
            line-height: 1.4;
            margin: 4px 0 2px 0;
            padding: 4px 6px;
            background: #F8FAFC;
            border-radius: 4px;
            max-height: 60px;
            overflow-y: auto;
            word-wrap: break-word;
            border: 1px solid transparent;
        }
        .note-preview:empty { display: none; }

        /* ========== MOBILE LIST VIEW ========== */
        .mobile-list-view {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 6px;
            width: 100%;
        }
        .mobile-card {
            background: #FFF;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .mobile-card.plantao-card { background-color: var(--plantao-bg) !important; border-color: var(--plantao-border) !important; }
        .mobile-card.annotated-card { background-color: var(--bg-annotated) !important; border-color: var(--border-annotated) !important; }
        .mobile-card.today-card { border: 2px solid #F59E0B !important; background-color: #FFFBEB !important; }
        .mobile-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            flex-wrap: wrap;
        }
        .mobile-card-date {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .mobile-day-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* ========== FOOTER ========== */
        footer {
            padding: 14px 20px;
            background-color: #F8FAFC;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .legend-container {
            display: flex;
            gap: 12px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .l-dot { width: 12px; height: 12px; border-radius: 50%; }
        .l-active { background: var(--rio-light); border: 2px solid var(--rio-light); }
        .l-today { background-color: #FFFBEB; border: 2px solid #F59E0B; }
        .l-annotated { background-color: var(--bg-annotated); border: 1px solid var(--border-annotated); }
        .credit-footer { font-size: 11px; color: var(--text-muted); }

        /* ========== RESPONSIVIDADE ========== */
        @media (max-width: 768px) {
            .calendar-grid-table { min-width: 600px; }
            .calendar-grid-table td { min-height: 70px; padding: 4px 3px; }
            .date-num { font-size: 12px; }
            .duty-day-circle { width: 20px; height: 20px; font-size: 10px; }
            .badge { font-size: 9px; padding: 2px 6px; }
            .plantao-label { font-size: 9px; }
            .note-preview {
                font-size: 13px !important;
                line-height: 1.5 !important;
                padding: 4px 6px !important;
                max-height: 50px !important;
            }
            .top-bar-header { font-size: 14px; }
            .title-block .month-title { font-size: 24px; }
        }

        @media (max-width: 480px) {
            .calendar-grid-table { min-width: 450px; }
            .calendar-grid-table td { min-height: 60px; padding: 3px 2px; }
            .date-num { font-size: 11px; }
            .duty-day-circle { width: 18px; height: 18px; font-size: 9px; }
            .badge { font-size: 8px; padding: 1px 4px; }
            .note-preview { font-size: 12px !important; padding: 3px 4px !important; max-height: 40px !important; }
            .btn-action { font-size: 11px; padding: 6px 10px; }
            .toolbar { padding: 8px; gap: 4px; }
        }
    </style>
</head>
<body>

    <!-- ========== CALENDÁRIO (SEM LOGIN, SEM EDIÇÃO) ========== -->
    <div class="calendar-container" id="calendar-screen">
        <div class="top-bar-header">
            Plantão — Visualização
            <span class="badge-visualizacao">🔍 Somente leitura</span>
        </div>
        <header>
            <div class="title-block">
                <div class="month-title" id="month-label">Julho</div>
                <div class="year-title" id="year-label">2026</div>
            </div>
        </header>

        <div class="toolbar">
            <div class="nav-controls">
                <button class="btn-action" id="btn-prev-month">« Ant</button>
                <button class="btn-action" id="btn-next-month">Próx »</button>
            </div>
            <div class="view-controls">
                <button class="btn-action active" id="view-grid-btn">Calendário</button>
                <button class="btn-action" id="view-list-btn">Lista</button>
            </div>
            <div class="jump-control">
                <select id="jump-month-select"></select>
                <select id="jump-year-select"></select>
                <button class="btn-action" id="jump-submit-btn">Ir</button>
            </div>
        </div>

        <div class="calendar-content">
            <table class="calendar-grid-table" id="main-grid-view">
                <thead><tr><th>Dom</th><th>Seg</th><th>Ter</th><th>Qua</th><th>Qui</th><th>Sex</th><th>Sáb</th></tr></thead>
                <tbody id="calendar-table-body"></tbody>
            </table>
            <div class="mobile-list-view" id="main-list-view"></div>
        </div>

        <footer>
            <div class="legend-container">
                <div class="legend-item"><div class="l-dot l-active"></div> Plantão</div>
                <div class="legend-item"><div class="l-dot l-today"></div> Hoje</div>
                <div class="legend-item"><div class="l-dot l-annotated"></div> Com Anotação</div>
            </div>
            <span class="credit-footer">Desenvolvido por <strong>Felipe Souza</strong></span>
        </footer>
    </div>

    <!-- ========== JAVASCRIPT (somente leitura) ========== -->
    <script type="module">
        // ========== CONFIGURAÇÃO FIREBASE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyAWzxdzAi8u0oz-NFQcTxxwt6kI-8y72hQ",
            authDomain: "escalaaberta-d968c.firebaseapp.com",
            projectId: "escalaaberta-d968c",
            storageBucket: "escalaaberta-d968c.firebasestorage.app",
            messagingSenderId: "259093020146",
            appId: "1:259093020146:web:86ea2cbf2789e0937f3f6b",
            measurementId: "G-ETSK8NEHDF"
        };
        // ===========================================

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import {
            getFirestore,
            collection,
            doc,
            getDocs,
            getDoc,
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let notesCache = {};

        // ========== CONFIGURAÇÃO DA ESCALA ==========
        let staffConfig = {
            rotation: ["Carlos", "Leticia", "Gustavo", "Tatiane"],
            excecoes: {},
            quantidades: { sexta: 1, sabado: 1, domingo: 1 },
            manual_overrides: {}
        };

        // ========== FUNÇÃO PARA GERAR CORES ÚNICAS ==========
        function getColorForName(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);
            const sat = 70 + (hash % 15);
            const light = 50 + (hash % 15);
            return `hsl(${hue}, ${sat}%, ${light}%)`;
        }

        // ========== CONSTANTES ==========
        const monthNamesList = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        const dayNamesList = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
        let activeMonth = new Date().getMonth();
        let activeYear = Math.min(Math.max(new Date().getFullYear(), 2026), 2035);

        const yearSelect = document.getElementById("jump-year-select");
        for (let y = 2026; y <= 2035; y++) {
            const opt = document.createElement("option");
            opt.value = y;
            opt.innerText = y;
            yearSelect.appendChild(opt);
        }
        const monthSelect = document.getElementById("jump-month-select");
        monthNamesList.forEach((m, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.innerText = m;
            monthSelect.appendChild(opt);
        });

        // ==================== FUNÇÕES DE CONFIGURAÇÃO ====================
        async function loadStaffConfig() {
            try {
                const docRef = doc(db, "config", "staff");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    staffConfig.rotation = data.rotation || staffConfig.rotation;
                    staffConfig.excecoes = data.excecoes || {};
                    staffConfig.quantidades = data.quantidades || { sexta: 1, sabado: 1, domingo: 1 };
                    staffConfig.manual_overrides = data.manual_overrides || {};
                }
            } catch (error) {
                console.error("Erro ao carregar configuração:", error);
            }
        }

        // ==================== FUNÇÕES AUXILIARES ====================
        function noteKey(year, month, day) { return `${year}_${month}_${day}`; }

        function calculateDaysFromAnchor(y, m, d) {
            const anchor = Date.UTC(2026, 6, 3);
            const target = Date.UTC(y, m, d);
            return Math.floor((target - anchor) / (1000 * 60 * 60 * 24));
        }

        function mathematicalMod(n, m) { return ((n % m) + m) % m; }

        function escapeHtml(text) {
            return String(text ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ===== LÓGICA DO RODÍZIO =====
        function getWorkersForDate(year, month, day) {
            const key = noteKey(year, month, day);

            if (staffConfig.manual_overrides && staffConfig.manual_overrides[key]) {
                const overridden = staffConfig.manual_overrides[key];
                return { isDuty: overridden.length > 0, activeWorkers: overridden };
            }

            let activeWorkers = [];
            let isDuty = false;
            const diff = calculateDaysFromAnchor(year, month, day);
            const pos = mathematicalMod(diff, 14);

            const rotation = staffConfig.rotation || [];
            const excecoes = staffConfig.excecoes || {};
            const qtd = staffConfig.quantidades || { sexta: 1, sabado: 1, domingo: 1 };

            const dayOfWeek = new Date(year, month, day).getDay();
            const excecaoNomes = excecoes[dayOfWeek] || [];

            let isPlantaoRegra = false;
            let posTipo = null;

            if (pos === 6) { isPlantaoRegra = true;
                posTipo = 'quinta'; } else if (pos === 7) { isPlantaoRegra = true;
                posTipo = 'sexta'; } else if (pos === 8) { isPlantaoRegra = true;
                posTipo = 'sabado'; } else if (pos === 9) { isPlantaoRegra = true;
                posTipo = 'domingo'; }

            if (isPlantaoRegra) {
                isDuty = true;
                if (posTipo === 'quinta') {
                    // quinta removida
                } else {
                    if (rotation.length > 0) {
                        const plantaoIndex = Math.floor((diff - pos) / 14);
                        const qtdSexta = Math.max(0, parseInt(qtd.sexta) || 1);
                        const qtdSabado = Math.max(0, parseInt(qtd.sabado) || 1);
                        const qtdDomingo = Math.max(0, parseInt(qtd.domingo) || 1);
                        const totalPorPlantao = qtdSexta + qtdSabado + qtdDomingo;

                        let offset = 0;
                        let quantidade = 0;
                        if (posTipo === 'sexta') {
                            offset = plantaoIndex * totalPorPlantao;
                            quantidade = qtdSexta;
                        } else if (posTipo === 'sabado') {
                            offset = plantaoIndex * totalPorPlantao + qtdSexta;
                            quantidade = qtdSabado;
                        } else if (posTipo === 'domingo') {
                            offset = plantaoIndex * totalPorPlantao + qtdSexta + qtdSabado;
                            quantidade = qtdDomingo;
                        }

                        for (let i = 0; i < quantidade; i++) {
                            const idx = mathematicalMod(offset + i, rotation.length);
                            activeWorkers.push(rotation[idx]);
                        }
                    }
                }
            }

            if (isPlantaoRegra && excecaoNomes.length > 0) {
                activeWorkers.push(...excecaoNomes);
            }

            activeWorkers = [...new Set(activeWorkers)];
            return { isDuty, activeWorkers };
        }

        function isPlantaoDia(year, month, day, isDutyOriginal) { return isDutyOriginal; }

        // ==================== ANOTAÇÕES ====================
        async function loadNotesFromServer() {
            try {
                const snapshot = await getDocs(collection(db, "agenda"));
                notesCache = {};
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (typeof data.nota === "string" && data.nota.trim()) {
                        notesCache[docSnap.id] = data.nota;
                    }
                });
                buildCalendar();
            } catch (error) {
                console.error("Erro ao carregar anotações:", error);
                buildCalendar();
            }
        }

        // ==================== CONSTRUIR CALENDÁRIO ====================
        function buildCalendar() {
            const firstDay = new Date(activeYear, activeMonth, 1).getDay();
            const daysInMonth = new Date(activeYear, activeMonth + 1, 0).getDate();
            const today = new Date();

            document.getElementById("month-label").innerText = monthNamesList[activeMonth];
            document.getElementById("year-label").innerText = activeYear;
            monthSelect.value = String(activeMonth);
            if (activeYear >= 2026 && activeYear <= 2035) yearSelect.value = String(activeYear);

            const tbody = document.getElementById("calendar-table-body");
            const listView = document.getElementById("main-list-view");
            tbody.innerHTML = "";
            listView.innerHTML = "";
            let dayNum = 1;

            for (let w = 0; w < 6; w++) {
                const tr = document.createElement("tr");
                let hasData = false;
                for (let d = 0; d < 7; d++) {
                    const td = document.createElement("td");
                    if ((w === 0 && d < firstDay) || dayNum > daysInMonth) {
                        td.className = "empty-cell";
                    } else {
                        hasData = true;
                        const currentDayNum = dayNum;
                        const isToday = currentDayNum === today.getDate() && activeYear === today.getFullYear() && activeMonth === today.getMonth();

                        const { isDuty, activeWorkers } = getWorkersForDate(activeYear, activeMonth, currentDayNum);
                        const isPlantao = isPlantaoDia(activeYear, activeMonth, currentDayNum, isDuty);
                        const savedNote = notesCache[noteKey(activeYear, activeMonth, currentDayNum)] || "";
                        const hasNote = savedNote.trim() !== '';

                        if (isPlantao) td.classList.add("plantao-cell");
                        if (isToday) td.classList.add("today-cell");
                        if (hasNote && !isToday && !isPlantao) td.classList.add("annotated-cell");

                        let html = `<div class="date-row">
                            ${isDuty ? `<div class="duty-day-circle">${currentDayNum}</div>` : `<div class="date-num">${currentDayNum}</div>`}
                        </div>`;
                        if (isPlantao) html += `<span class="plantao-label">Plantão</span>`;
                        html += `<div class="badges-list">`;

                        if (activeWorkers.length === 0) {
                            html += `<span class="badge-empty">(vazio)</span>`;
                        } else {
                            activeWorkers.forEach(worker => {
                                const color = getColorForName(worker);
                                html += `<span class="badge" style="background-color: ${color};">${escapeHtml(worker)}</span>`;
                            });
                        }
                        html += `</div>`;

                        if (hasNote) {
                            html += `<div class="note-preview" data-day="${currentDayNum}">${savedNote}</div>`;
                        }

                        td.innerHTML = html;

                        // Mobile card
                        const card = document.createElement("div");
                        card.className = `mobile-card ${isPlantao ? 'plantao-card' : ''} ${isToday ? 'today-card' : ''}`;
                        if (hasNote && !isToday && !isPlantao) card.classList.add("annotated-card");

                        let cardHtml = `<div class="mobile-card-header">
                            <div class="mobile-card-date">
                                <span class="mobile-day-name">${dayNamesList[d]}</span>
                                ${isDuty ? `<div class="duty-day-circle">${currentDayNum}</div>` : `<span class="date-num">${currentDayNum}</span>`}
                                ${isPlantao ? `<span class="plantao-label">Plantão</span>` : ''}
                            </div>
                            <div class="badges-list">`;
                        if (activeWorkers.length === 0) cardHtml += `<span class="badge-empty">(vazio)</span>`;
                        else {
                            activeWorkers.forEach(worker => {
                                const color = getColorForName(worker);
                                cardHtml += `<span class="badge" style="background-color: ${color};">${escapeHtml(worker)}</span>`;
                            });
                        }
                        cardHtml += `</div></div>`;

                        if (hasNote) {
                            cardHtml += `<div class="note-preview" data-mobile-day="${currentDayNum}">${savedNote}</div>`;
                        }
                        card.innerHTML = cardHtml;
                        listView.appendChild(card);
                        dayNum++;
                    }
                    tr.appendChild(td);
                }
                if (hasData) tbody.appendChild(tr);
                if (dayNum > daysInMonth) break;
            }
        }

        // ==================== NAVEGAÇÃO ====================
        document.getElementById('view-grid-btn').onclick = () => {
            document.getElementById('main-grid-view').style.display = 'table';
            document.getElementById('main-list-view').style.display = 'none';
            document.getElementById('view-grid-btn').classList.add('active');
            document.getElementById('view-list-btn').classList.remove('active');
        };
        document.getElementById('view-list-btn').onclick = () => {
            document.getElementById('main-grid-view').style.display = 'none';
            document.getElementById('main-list-view').style.display = 'flex';
            document.getElementById('view-list-btn').classList.add('active');
            document.getElementById('view-grid-btn').classList.remove('active');
        };
        document.getElementById('btn-prev-month').onclick = () => {
            activeMonth--;
            if (activeMonth < 0) { activeMonth = 11;
                activeYear--; }
            if (activeYear < 2026) { activeYear = 2026;
                activeMonth = 0; }
            buildCalendar();
        };
        document.getElementById('btn-next-month').onclick = () => {
            activeMonth++;
            if (activeMonth > 11) { activeMonth = 0;
                activeYear++; }
            if (activeYear > 2035) { activeYear = 2035;
                activeMonth = 11; }
            buildCalendar();
        };
        document.getElementById('jump-submit-btn').onclick = () => {
            activeMonth = parseInt(monthSelect.value, 10);
            activeYear = parseInt(yearSelect.value, 10);
            buildCalendar();
        };

        // ==================== INICIALIZAÇÃO ====================
        await loadStaffConfig();
        await loadNotesFromServer();
    </script>
</body>
</html>
